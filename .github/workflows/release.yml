name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # O runner já costuma trazer o Inno Setup; o choco cobre quando não traz.
      - name: Garantir o Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      # build.ps1 le a versao do MSBuild, roda os testes, publica e chama o
      # ISCC. Mesmo caminho da geracao local -- nada especifico de CI aqui.
      - name: Gerar o instalador
        shell: pwsh
        run: .\installer\windows\build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/installer/*.exe

  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Gerar o pacote
        run: |
          chmod +x installer/linux/build.sh
          installer/linux/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: artifacts/installer/*.tar.gz

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Rascunho de proposito: alguem confere o teste de fumaca manual de
      # installer/README.md antes de o mundo baixar.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.tar.gz

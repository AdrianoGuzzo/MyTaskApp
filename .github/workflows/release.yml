name: Release

# Gera os instaladores de UMA tag e os anexa à release em rascunho que o
# Release Please criou para ela (ADR-044). Não cria tag nem release, e nunca
# substitui nada: se a release já foi publicada ou já tem artefatos, para.
#
# Chamado pelo release-please.yml logo depois de a tag nascer. O disparo manual
# existe para refazer o build de um rascunho que falhou — não para criar
# versão: versão nova é sempre um PR de release mesclado.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag criada pelo Release Please (vX.Y.Z)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de um rascunho já criado pelo Release Please (ex. v1.5.0)
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}

    steps:
      - name: Conferir o formato da tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' não é vMAJOR.MINOR.PATCH."
            exit 1
          fi

      # refs/tags/ explícito: um branch com o mesmo nome não pode ser pego no
      # lugar da tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # A tag e o código precisam dizer o mesmo número. Se divergirem, o
      # instalador sairia com uma versão e a release com outra.
      - name: A versão do código é a da tag
        id: version
        run: |
          version="$(dotnet msbuild src/MyTaskApp.Desktop/MyTaskApp.Desktop.csproj -getProperty:Version -v:q --nologo | tr -d '[:space:]')"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::A tag é $TAG, mas Directory.Build.props diz $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Versão $version, commit $(git rev-parse HEAD)"

      # Release publicada é imutável: um cliente pode já ter baixado aquele
      # instalador. Refazer só vale para rascunho, e sem artefatos — apagar os
      # que estiverem lá é uma decisão de alguém, não deste script.
      - name: A release existe, é rascunho e está vazia
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! release="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets)"; then
            echo "::error::Não há release para $TAG. Versões nascem do PR de release do Release Please."
            exit 1
          fi
          if [ "$(jq -r '.isDraft' <<<"$release")" != "true" ]; then
            echo "::error::$TAG já foi publicada. Versão publicada não se refaz: corrija e gere a próxima."
            exit 1
          fi
          assets="$(jq '.assets | length' <<<"$release")"
          if [ "$assets" != "0" ]; then
            echo "::error::O rascunho de $TAG já tem $assets artefato(s). Apague-os no GitHub para refazer de propósito."
            exit 1
          fi

  windows:
    needs: verify
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # O runner já costuma trazer o Inno Setup; o choco cobre quando não traz.
      - name: Garantir o Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      # build.ps1 lê a versão do MSBuild, roda os testes, publica e chama o
      # ISCC. Mesmo caminho da geração local — nada específico de CI aqui.
      # Teste vermelho = nenhum instalador.
      # O app OAuth do Jira (ADR-045): o MSBuild lê variáveis de ambiente como
      # propriedades, e o Infrastructure.csproj grava as duas como metadado do
      # assembly. Sem os secrets no repositório do GitHub, o instalador sai sem
      # o login de um clique — só com o caminho do API token. Só no Windows: no
      # Linux ainda não há cofre para o token, e o secret não iria para nada.
      - name: Testar e gerar o instalador
        shell: pwsh
        env:
          JiraClientId: ${{ secrets.JIRA_CLIENT_ID }}
          JiraClientSecret: ${{ secrets.JIRA_CLIENT_SECRET }}
        run: .\installer\windows\build.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: artifacts/installer/*.exe
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Gerar o pacote
        run: |
          chmod +x installer/linux/build.sh
          installer/linux/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-package
          path: artifacts/installer/*.tar.gz
          if-no-files-found: error

  # O app do celular (ADR-067) como APK assinado, para instalar fora da Play
  # Store (docs/mobile.md, "Teste pessoal sem custo, só com Windows"). A chave
  # é sempre a mesma keystore, guardada nos secrets: só assim a versão
  # seguinte instala por cima. Sem os secrets a release para — um APK com a
  # chave de debug não atualizaria o que já está no celular, e desinstalar
  # apaga os dados dele.
  android:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      # Antes do workload e do build: faltar configuração é descoberto em
      # segundos, não depois de dez minutos de compilação. Só testa se está
      # vazio; nenhum valor vai para o log.
      - name: Conferir a configuração do Android
        env:
          SYNC_API_BASE_URL: ${{ vars.SYNC_API_BASE_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # O servidor fica gravado no app, e o build Release recusa HTTP.
          if [[ "$SYNC_API_BASE_URL" != https://* ]]; then
            echo "::error::A variável SYNC_API_BASE_URL está vazia ou não é https://. Cadastre-a em Settings → Secrets and variables → Actions → Variables (docs/mobile.md)."
            exit 1
          fi
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Faltam os secrets ${missing[*]}. Sem eles o APK sairia com a chave de debug e não atualizaria por cima (docs/mobile.md)."
            exit 1
          fi

      - name: Instalar o workload do Android
        run: dotnet workload install maui-android

      # Em $RUNNER_TEMP, fora do checkout: a keystore nunca pode acabar num
      # artefato nem num `git add` de alguém depurando o workflow.
      - name: Decodificar a keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          base64 -d <<<"$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/mytaskapp.jks"
          test -s "$RUNNER_TEMP/mytaskapp.jks" || { echo "::error::ANDROID_KEYSTORE_BASE64 não é base64 de uma keystore."; exit 1; }

      # As senhas vão pelo prefixo env: do .NET Android: o MSBuild as lê do
      # ambiente, e elas não aparecem na linha de comando nem no log.
      - name: Gerar o APK
        env:
          SYNC_API_BASE_URL: ${{ vars.SYNC_API_BASE_URL }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          dotnet publish src/MyTaskApp.Mobile/MyTaskApp.Mobile.csproj
          -f net10.0-android -c Release
          -p:AndroidPackageFormats=apk
          -p:SyncApiBaseUrl="$SYNC_API_BASE_URL"
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/mytaskapp.jks"
          -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          -p:AcceptAndroidSDKLicenses=True

      - name: Apagar a keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mytaskapp.jks"

      # Exatamente um: dois APKs assinados na pasta significam um build sujo, e
      # escolher um deles seria adivinhar.
      - name: Nomear o APK
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mapfile -t apks < <(find src/MyTaskApp.Mobile/bin/Release/net10.0-android -path '*/publish/*' -name '*-Signed.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::Esperava um *-Signed.apk no publish, achei ${#apks[@]}: ${apks[*]}"
            exit 1
          fi
          mkdir -p artifacts/installer
          cp "${apks[0]}" "artifacts/installer/MyTaskApp-$VERSION-android.apk"

      # A mesma conferência do CI (SQLite nativo), mais o que só a release
      # tem: assinatura que não é a de debug e versionCode igual ao da tag.
      - name: Conferir o APK
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash scripts/check-android-apk.sh "artifacts/installer/MyTaskApp-$VERSION-android.apk" "$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: artifacts/installer/*.apk
          if-no-files-found: error

  publish:
    needs: [verify, windows, linux, android]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # Os nomes são o contrato com quem baixa: produto-versão-rid.
      - name: Conferir os artefatos
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for expected in "MyTaskApp-$VERSION-win-x64-setup.exe" "MyTaskApp-$VERSION-linux-x64.tar.gz" "MyTaskApp-$VERSION-android.apk"; do
            test -f "dist/$expected" || { echo "::error::Faltou dist/$expected"; ls -la dist; exit 1; }
          done

      - name: Gerar SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      # Sem --clobber de propósito: um artefato com o mesmo nome já lá faz o
      # upload falhar, em vez de trocar um instalador em silêncio.
      - name: Anexar à release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

      # As notas vêm do CHANGELOG.md (Release Please). Aqui só entra o que
      # liga o instalador ao código: o commit e os hashes.
      - name: Completar as notas
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          {
            echo
            echo "## Rastreabilidade"
            echo
            echo "- Commit: [\`${SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA) (\`$SHA\`)"
            echo "- Build: [execução $GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo "## SHA-256"
            echo
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo 'Conferir: `sha256sum -c SHA256SUMS` (Linux) ou `Get-FileHash <arquivo>` (Windows).'
          } >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

      - name: Resumo
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          {
            echo "### $TAG pronta em rascunho"
            echo
            echo "Rode o teste de fumaça de installer/README.md e publique em Releases."
            echo
            echo '```text'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

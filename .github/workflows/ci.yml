name: CI

on:
  push:
    # release/v* são os branches de manutenção de hotfix (docs/release-process.md).
    branches: [master, main, "release/v*"]
  pull_request:

permissions:
  contents: read
  pull-requests: write # comentário de cobertura no PR

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A versão sai de global.json — a mesma pinada para quem desenvolve.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # Duas solutions: o desktop (MyTaskApp.slnx) e o servidor de
      # sincronização (MyTaskApp.Server.slnx). O CI compila e testa as duas.
      - name: Restaurar
        shell: bash # -e: a primeira solution que falhar reprova o passo
        run: |
          dotnet restore MyTaskApp.slnx
          dotnet restore MyTaskApp.Server.slnx

      # TreatWarningsAsErrors=true: um aviso novo reprova aqui, não na máquina
      # de quem for gerar a release.
      - name: Compilar
        shell: bash
        run: |
          dotnet build MyTaskApp.slnx -c Release --no-restore
          dotnet build MyTaskApp.Server.slnx -c Release --no-restore

      # Testes + cobertura + portão num passo só: é o mesmo script que roda
      # local (scripts/coverage.ps1), e o mínimo mora nele. Reprova se algum
      # teste falhar ou se a cobertura ficar abaixo do mínimo.
      - name: Testar com cobertura
        shell: pwsh
        run: ./scripts/coverage.ps1 -NoBuild

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: artifacts/coverage/raw/*.trx
          if-no-files-found: ignore

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: artifacts/coverage/report
          if-no-files-found: ignore

      # Um comentário por PR, atualizado a cada push. PR de fork recebe token
      # só de leitura: lá o resumo fica só na aba da execução.
      - name: Comentar cobertura no PR
        if: >
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('artifacts/coverage/summary.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          path: artifacts/coverage/summary.md

  # Pacote NuGet com vulnerabilidade conhecida, direto ou transitivo, nas duas
  # solutions (SEC-016). Hoje o restore do job build também reprova (NuGetAudit
  # com TreatWarningsAsErrors), mas isso some com um NoWarn ou um projeto sem
  # TreatWarningsAsErrors. Este portão não depende do build: o restore deixa o
  # aviso passar, e o script lê o `dotnet list package --vulnerable` (que só
  # lista, sai com 0 de qualquer jeito) e reprova.
  vulnerable-packages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restaurar
        shell: bash
        run: |
          dotnet restore MyTaskApp.slnx -p:TreatWarningsAsErrors=false
          dotnet restore MyTaskApp.Server.slnx -p:TreatWarningsAsErrors=false

      - name: Pacotes vulneráveis
        shell: pwsh
        run: ./scripts/check-vulnerable-packages.ps1

  # O servidor de sincronização contra PostgreSQL de verdade (ADR-061). No
  # Windows esses testes pulam: o runner não roda contêiner Linux. Aqui o
  # Testcontainers sobe o postgres:17 e eles rodam de fato.
  server-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Testar o servidor de sincronização
        run: >
          dotnet test tests/MyTaskApp.Server.IntegrationTests/MyTaskApp.Server.IntegrationTests.csproj
          -c Release
          --logger "trx;LogFileName=server-integration.trx"
          --results-directory artifacts/server-integration

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-integration-results
          path: artifacts/server-integration/*.trx
          if-no-files-found: ignore

  # O app do celular (ADR-067): a casca MAUI fica fora das duas solutions
  # acima, que não precisam de workload. Aqui ela compila para Android em
  # Release (trimming e tudo), e o APK precisa levar o SQLite nativo — sem ele,
  # o app abre e morre na primeira consulta. Sem emulador: os testes do app
  # são os do Mobile.Core (job build) e os de ponta a ponta do servidor.
  mobile-android:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar o workload do Android
        run: dotnet workload install maui-android

      - name: Compilar o APK (Release)
        run: >
          dotnet build src/MyTaskApp.Mobile/MyTaskApp.Mobile.csproj
          -f net10.0-android -c Release
          -p:SyncApiBaseUrl=https://sync.example.invalid/
          -p:AcceptAndroidSDKLicenses=True

      - name: Conferir o APK
        shell: bash
        run: |
          apk=$(ls src/MyTaskApp.Mobile/bin/Release/net10.0-android/*-Signed.apk | head -1)
          test -n "$apk" || { echo "APK ausente"; exit 1; }
          # Sem -q: o grep -q sai no primeiro acerto, o unzip leva SIGPIPE (141)
          # e o pipefail do Actions transforma isso em falha.
          unzip -l "$apk" | grep "lib/arm64-v8a/libe_sqlite3.so" >/dev/null \
            || { echo "o APK não leva o SQLite nativo"; exit 1; }
          echo "ok: $apk"

  # O publish self-contained é o que o instalador empacota. Quebrar aqui
  # significa release quebrada, e é barato descobrir antes da tag.
  publish-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            binary: artifacts/publish/win-x64/MyTaskApp.exe
          - os: ubuntu-latest
            rid: linux-x64
            binary: artifacts/publish/linux-x64/MyTaskApp

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Publicar ${{ matrix.rid }}
        run: >
          dotnet publish src/MyTaskApp.Desktop/MyTaskApp.Desktop.csproj
          -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishTrimmed=false
          -o artifacts/publish/${{ matrix.rid }}

      # appsettings.json é carregado com optional:false: sem ele o app morre na
      # primeira linha do Main, já instalado na máquina de alguém.
      - name: Conferir o que o instalador vai empacotar
        shell: bash
        run: |
          test -f "${{ matrix.binary }}" || { echo "binário ausente"; exit 1; }
          test -f "artifacts/publish/${{ matrix.rid }}/appsettings.json" \
            || { echo "appsettings.json ausente — o app não iniciaria"; exit 1; }

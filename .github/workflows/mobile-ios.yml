name: Mobile iOS (manual)

# O app do celular para iOS (ADR-067) só compila num Mac, com Xcode. A
# configuração está pronta mas ainda não foi validada (docs/mobile.md); este
# workflow é o primeiro passo dessa validação, rodado à mão num runner macOS.
# Fica fora do CI dos PRs até passar a primeira vez.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Instalar o workload do iOS
        run: dotnet workload install maui-ios

      # Para o simulador: sem certificado nem perfil de provisionamento.
      - name: Compilar para o simulador
        run: >
          dotnet build src/MyTaskApp.Mobile/MyTaskApp.Mobile.csproj
          -f net10.0-ios -c Debug
          -p:RuntimeIdentifier=iossimulator-arm64

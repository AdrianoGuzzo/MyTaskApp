name: Mobile iOS (manual)

# O app do celular para iOS (ADR-067) só compila num Mac, com Xcode. Este
# workflow faz isso num runner macOS e entrega um .ipa SEM assinatura: quem
# testa assina e instala pelo Windows, com o Sideloadly ou o AltServer e um
# Apple ID gratuito (docs/mobile.md, "Teste pessoal sem custo, só com Windows").
#
# Só no disparo manual, e fora do release.yml de propósito: minuto de macOS
# custa 10x o de Linux, e o iOS ainda não foi validado num aparelho.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de uma release (ex. v1.18.0). Vazio = o branch escolhido acima.
        required: false
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  # Primeiro o simulador: não precisa de certificado nem de perfil, e quebra
  # rápido se a configuração (workload, Xcode, plists) estiver errada.
  ios-simulator:
    runs-on: macos-latest

    steps:
      # refs/tags/ explícito, como no release.yml: um branch com o mesmo nome
      # não pode ser pego no lugar da tag. Sem tag, o ref do disparo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}

      # O workload ios do .NET 10 exige uma versão do Xcode (a 26.x), e o
      # Xcode padrão do runner nem sempre é ela. latest-stable é o mais novo
      # que o runner tem; se o workload pedir outro, o build diz qual.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Instalar o workload do iOS
        run: dotnet workload install maui-ios

      - name: Compilar para o simulador
        run: >
          dotnet build src/MyTaskApp.Mobile/MyTaskApp.Mobile.csproj
          -f net10.0-ios -c Debug
          -p:RuntimeIdentifier=iossimulator-arm64

  # Para o iPhone, sem assinatura: a conta Apple gratuita não gera certificado
  # aqui. O Sideloadly/AltServer reassina com o Apple ID de quem instala.
  ios-device:
    needs: ios-simulator
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || '' }}

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # Com tag, a mesma regra do release.yml: o .ipa não pode dizer uma versão
      # e a release outra.
      - name: Versão
        id: version
        run: |
          version="$(dotnet msbuild src/MyTaskApp.Mobile.Core/MyTaskApp.Mobile.Core.csproj -getProperty:Version -v:q --nologo | tr -d '[:space:]')"
          if [ -n "$TAG" ] && [ "$version" != "${TAG#v}" ]; then
            echo "::error::A tag é $TAG, mas Directory.Build.props diz $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Versão $version, commit $(git rev-parse HEAD)"

      # O servidor fica gravado no app, e o build Release recusa HTTP.
      - name: Conferir o endereço do servidor
        env:
          SYNC_API_BASE_URL: ${{ vars.SYNC_API_BASE_URL }}
        run: |
          if [[ "$SYNC_API_BASE_URL" != https://* ]]; then
            echo "::error::A variável SYNC_API_BASE_URL está vazia ou não é https://. Cadastre-a em Settings → Secrets and variables → Actions → Variables (docs/mobile.md)."
            exit 1
          fi

      - name: Instalar o workload do iOS
        run: dotnet workload install maui-ios

      - name: Compilar para o aparelho, sem assinatura
        env:
          SYNC_API_BASE_URL: ${{ vars.SYNC_API_BASE_URL }}
        run: >
          dotnet publish src/MyTaskApp.Mobile/MyTaskApp.Mobile.csproj
          -f net10.0-ios -c Release
          -p:RuntimeIdentifier=ios-arm64
          -p:EnableCodeSigning=false
          -p:SyncApiBaseUrl="$SYNC_API_BASE_URL"

      # Um .ipa é só um zip com Payload/<app>.app. Se o publish já o gerou, ele
      # vai como está; senão, o .app é empacotado aqui. O ditto preserva os
      # links simbólicos e as permissões que o zip comum perderia.
      - name: Empacotar o .ipa
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="$PWD/artifacts/installer/MyTaskApp-$VERSION-ios-unsigned.ipa"
          bin=src/MyTaskApp.Mobile/bin/Release/net10.0-ios/ios-arm64
          mkdir -p artifacts/installer
          ipas=()
          while IFS= read -r ipa; do ipas+=("$ipa"); done < <(find "$bin" -name '*.ipa')
          if [ "${#ipas[@]}" -eq 1 ]; then
            cp "${ipas[0]}" "$out"
          elif [ "${#ipas[@]}" -eq 0 ]; then
            apps=()
            while IFS= read -r app; do apps+=("$app"); done < <(find "$bin" -maxdepth 1 -name '*.app' -type d)
            if [ "${#apps[@]}" -ne 1 ]; then
              echo "::error::Sem .ipa, esperava um .app em $bin, achei ${#apps[@]}."
              exit 1
            fi
            staging="$RUNNER_TEMP/ipa"
            rm -rf "$staging"
            mkdir -p "$staging/Payload"
            cp -R "${apps[0]}" "$staging/Payload/"
            (cd "$staging" && ditto -c -k --sequesterRsrc --keepParent Payload "$out")
          else
            echo "::error::Mais de um .ipa em $bin: ${ipas[*]}"
            exit 1
          fi

          # O Sideloadly recusa um .ipa sem Info.plist ou sem o executável.
          listing="$(unzip -l "$out")"
          grep -E "Payload/[^/]+\.app/Info\.plist$" <<<"$listing" >/dev/null \
            || { echo "::error::O .ipa não tem Payload/*.app/Info.plist."; exit 1; }
          grep -E "Payload/[^/]+\.app/MyTaskApp\.Mobile$" <<<"$listing" >/dev/null \
            || { echo "::error::O .ipa não tem o executável MyTaskApp.Mobile."; exit 1; }

          {
            echo "### MyTaskApp $VERSION para iOS, sem assinatura"
            echo
            echo "Instale pelo Sideloadly ou pelo AltServer (docs/mobile.md)."
            echo
            echo '```text'
            (cd artifacts/installer && shasum -a 256 -- *.ipa)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: artifacts/installer/*.ipa
          if-no-files-found: error

  # Só com tag, e só num rascunho: release publicada é imutável (ADR-044). Em
  # Linux, para não pagar minuto de macOS por um upload. O .ipa fica fora do
  # SHA256SUMS, que o release.yml gera antes; e, com ele anexado, refazer o
  # release.yml daquela tag exige apagar os artefatos do rascunho, como já hoje.
  attach:
    needs: ios-device
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-ipa
          path: dist

      # Sem --clobber de propósito: um .ipa com o mesmo nome já lá faz o upload
      # falhar, em vez de trocar o arquivo em silêncio.
      - name: Anexar ao rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! release="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft)"; then
            echo "::notice::Não há release para $TAG; o .ipa fica só no artifact ios-ipa."
            exit 0
          fi
          if [ "$(jq -r '.isDraft' <<<"$release")" != "true" ]; then
            echo "::notice::$TAG já foi publicada e não recebe arquivo novo; o .ipa fica só no artifact ios-ipa."
            exit 0
          fi
          gh release upload "$TAG" dist/*.ipa --repo "$GITHUB_REPOSITORY"
